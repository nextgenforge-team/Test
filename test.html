<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Camera</title>
    <!-- We load tracking.js, a lightweight library to detect faces -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: white;
            padding-top: 50px;
        }
        video {
            border: 4px solid #00ffcc;
            border-radius: 10px;
            background: #222;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #00ffcc;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Person Detector Greeting App</h1>
    <!-- Modern browsers block sound/speech until the user clicks something first -->
    <button id="startBtn">Click to Start Camera & Audio</button>
    <br>
    <video id="video" width="320" height="240" preload autoplay loop muted></video>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        let canSpeak = true;

        startBtn.addEventListener('click', () => {
            startCamera();
            startBtn.style.display = 'none'; // Hide button after click
        });

        function startCamera() {
            // 1. Get access to the webcam
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    setupTracking();
                })
                .catch(err => {
                    alert("Camera access denied or not found.");
                    console.error(err);
                });
        }

        function setupTracking() {
            // 2. Set up the face tracker
            const tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4);
            tracker.setStepSize(2);
            tracker.setEdgesDensity(0.1);

            tracking.track('#video', tracker);

            // 3. Trigger when a face is found
            tracker.on('track', function(event) {
                if (event.data.length > 0 && canSpeak) {
                    speakGreeting();
                }
            });
        }

        function speakGreeting() {
            canSpeak = false; // Stop it from talking repeatedly instantly

            // 4. Use Browser Text-to-Speech
            const msg = new SpeechSynthesisUtterance("Hello there! Welcome in front of my project.");
            
            window.speechSynthesis.speak(msg);

            // Wait 5 seconds before it is allowed to greet someone again
            setTimeout(() => {
                canSpeak = true;
            }, 5000);
        }
    </script>
</body>
</html>
