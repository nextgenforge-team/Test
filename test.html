<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Face Detector</title>
    <!-- Lightweight tracking script -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding-top: 50px; }
        video { border: 4px solid #00ffcc; border-radius: 10px; background: #222; transform: scaleX(-1); }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #00ffcc; color: black; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        #status { color: #aaa; margin-top: 15px; font-size: 16px; font-style: italic; }
    </style>
</head>
<body>

    <h1>AI Greeting Project</h1>
    <button id="startBtn">Click to Turn On Camera</button>
    <br>
    <video id="video" width="320" height="240" autoplay playsinline muted></video>
    <p id="status">Status: Waiting for click...</p>

    <script>
        const video = document.getElementById('video');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');
        let canSpeak = true;

        startBtn.addEventListener('click', () => {
            status.innerText = "Status: Prompting for camera permission...";
            startBtn.style.display = 'none';
            
            // Step 1: Open the camera natively first
            navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } })
                .then(stream => {
                    video.srcObject = stream;
                    status.innerText = "Status: Camera connected! Starting tracker...";
                    
                    // Step 2: Only start face math once video is running
                    video.onloadedmetadata = () => {
                        video.play();
                        startFaceTracking();
                    };
                })
                .catch(err => {
                    status.innerText = "Status: Error opening camera. Is it blocked?";
                    console.error(err);
                });
        });

        function startFaceTracking() {
            const tracker = new tracking.ObjectTracker('face');
            tracker.setInitialScale(4);
            tracker.setStepSize(2);
            tracker.setEdgesDensity(0.1);

            tracking.track('#video', tracker);
            status.innerText = "Status: Scanning... Stand in front of the lens!";

            // Step 3: Listen for faces in the video box
            tracker.on('track', function(event) {
                if (event.data.length > 0) {
                    status.innerText = "Status: Found you! Speaking greeting...";
                    if (canSpeak) {
                        speak();
                    }
                } else {
                    status.innerText = "Status: Scanning... (No faces seen)";
                }
            });
        }

        function speak() {
            canSpeak = false;
            
            const msg = new SpeechSynthesisUtterance("Hello there! Welcome in front of my project.");
            window.speechSynthesis.cancel(); // Clear any audio blocks
            window.speechSynthesis.speak(msg);

            // Cooldown for 7 seconds so it doesn't loop overlapping audio
            setTimeout(() => {
                canSpeak = true;
            }, 7000);
        }
    </script>
</body>
</html>
